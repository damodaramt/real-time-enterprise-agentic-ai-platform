version: "3.9"

services:

  postgres:

    image: pgvector/pgvector:pg16

    container_name: enterprise-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d enterprise_ai"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - enterprise-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:

    build:
      context: .

    container_name: enterprise-ai-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - enterprise-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 20s

networks:

  enterprise-network:

    driver: bridge

volumes:

  postgres_data:
